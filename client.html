<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebLLM Serve - HTTP Client</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="chat-shell">
      <aside class="settings panel">
        <div class="panel-title">
          <h1 data-i18n="clientTitle">HTTP 客户端</h1>
          <span id="clientStatus" class="status-dot" data-i18n="disconnected">未连接</span>
        </div>
        <label class="field language-field compact-field">
          <span data-i18n="languageLabel">语言</span>
          <select id="languageSelect">
            <option value="zh" data-i18n="chinese">中文</option>
            <option value="en" data-i18n="english">English</option>
          </select>
        </label>
        <label class="field compact-field">
          <span>Base URL</span>
          <input id="baseUrl" value="http://127.0.0.1:21434/v1" />
        </label>
        <label class="field compact-field">
          <span>API Key</span>
          <input id="apiKey" value="webllm-local" />
        </label>
        <label class="field compact-field">
          <span data-i18n="serverModelLabel">Gateway 当前模型</span>
          <input id="serverModel" data-i18n-placeholder="notLoaded" placeholder="未加载" readonly />
        </label>
        <label class="checkbox-field">
          <input id="sendSystemPrompt" type="checkbox" checked />
          <span data-i18n="sendSystemPromptLabel">Send System Prompt</span>
        </label>
        <label class="field">
          <span data-i18n="systemPromptLabel">System Prompt</span>
          <textarea id="systemPrompt" rows="5">You are a helpful assistant.</textarea>
        </label>
        <label class="checkbox-field">
          <input id="sendSamplingParams" type="checkbox" checked />
          <span data-i18n="sendSamplingParamsLabel">Send sampling params</span>
        </label>
        <div class="two-col">
          <label class="field">
            <span data-i18n="maxTokensLabel">Max Tokens</span>
            <input id="maxTokens" type="number" min="1" max="8192" value="512" />
          </label>
          <label class="field">
            <span data-i18n="temperatureLabel">Temperature</span>
            <input id="temperature" type="number" min="0" max="2" step="0.1" value="0.7" />
          </label>
        </div>
        <div class="two-col">
          <label class="field">
            <span data-i18n="topPLabel">Top P</span>
            <input id="topP" type="number" min="0" max="1" step="0.05" value="0.8" />
          </label>
          <label class="field">
            <span data-i18n="streamLabel">Stream</span>
            <select id="stream">
              <option value="true" data-i18n="streamOn">开启</option>
              <option value="false" data-i18n="streamOff">关闭</option>
            </select>
          </label>
        </div>
        <div class="action-row">
          <button id="connectServer" class="button primary" type="button" data-i18n="checkGatewayButton">检查 Gateway</button>
          <button id="refreshModels" class="button secondary" type="button" data-i18n="refreshModelsButton">刷新模型</button>
          <button id="clearChat" class="button secondary" type="button" data-i18n="clearChatButton">清空对话</button>
        </div>
        <p class="small-note" data-i18n="clientNote">
          这个页面通过 OpenAI HTTP API 调用 Go gateway；实际推理由 server.html 中加载的 WebLLM 完成。
        </p>
      </aside>

      <section class="chat-main panel">
        <div id="messages" class="messages"></div>
        <form id="chatForm" class="composer">
          <textarea id="userInput" rows="3" data-i18n-placeholder="userInputPlaceholder" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
          <button class="button primary" type="submit" data-i18n="sendButton">发送</button>
        </form>
        <details class="raw-box">
          <summary data-i18n="rawSummary">原始 OpenAI 请求/响应</summary>
          <pre id="rawJson"></pre>
        </details>
      </section>
    </main>

    <script type="module" src="./src/client.js"></script>
  </body>
</html>
