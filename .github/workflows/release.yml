name: Release

# Before the first release, check the GitHub repository setting:
# Settings -> Actions -> General -> Workflow permissions
# Select: Read and write permissions
#
# To publish a release:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Then check:
#   GitHub repository -> Actions
#   GitHub repository -> Releases

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build gateway packages
        run: sh scripts/build-gateway.sh dist release embedded

      - name: Archive release packages
        shell: bash
        run: |
          set -eu
          mkdir -p artifacts
          (cd release && zip -r ../artifacts/webllm-serve-windows-amd64.zip webllm-serve-windows-amd64)
          (cd release && zip -r ../artifacts/webllm-serve-windows-arm64.zip webllm-serve-windows-arm64)
          tar -czf artifacts/webllm-serve-macos-amd64.tar.gz -C release webllm-serve-macos-amd64
          tar -czf artifacts/webllm-serve-macos-arm64.tar.gz -C release webllm-serve-macos-arm64
          tar -czf artifacts/webllm-serve-linux-amd64.tar.gz -C release webllm-serve-linux-amd64
          tar -czf artifacts/webllm-serve-linux-arm64.tar.gz -C release webllm-serve-linux-arm64

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
