<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebLLM Serve</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="home-shell">
      <section class="home-hero">
        <p class="eyebrow">WebLLM Serve</p>
        <h1>浏览器里的本地模型服务台</h1>
        <p class="lede">
          主线版本通过 Go gateway 提供 OpenAI 兼容 HTTP API，服务端页面负责在浏览器内运行 WebLLM。
        </p>
        <div class="home-actions">
          <a class="button primary" href="./server.html">打开服务端</a>
          <a class="button secondary" href="./client.html">打开 HTTP 客户端</a>
          <a class="button secondary" href="./server-same-origin.html">同源服务端</a>
          <a class="button secondary" href="./client-same-origin.html">同源客户端</a>
        </div>
      </section>
      <section class="note-band">
        <strong>提示：</strong>运行 <code>go run ./gateway</code> 后，可通过
        <code>http://127.0.0.1:21434/v1</code> 使用 OpenAI API。同源页面保留为
        BroadcastChannel 验证版本。
      </section>
    </main>
  </body>
</html>
